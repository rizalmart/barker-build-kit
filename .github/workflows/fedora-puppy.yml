name: Build Custom Fedora KDE RootFS (Testing)

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged # Necessary for mounting and chroot operations

    steps:
      - name: Install Host Build Dependencies
        run: |
          dnf install -y wget tar xz squashfs-tools dnf-plugins-core \
          gcc gcc-c++ make automake autoconf gtk2-devel gtk3-devel \
          libxml2-devel glib2-devel git passwd busybox docker

      - name: Set up Fedora Rawhide Bootstrap Rootfs
        run: |

          BUILD_ROOTFS="$(pwd)/build-rootfs"
        
          # Create the local directory for the root filesystem
          mkdir -p $BUILD_ROOTFS
      
          dnf install -y --use-host-config --releasever=rawhide --installroot=$BUILD_ROOTFS --setopt=install_weak_deps=False \
              fedora-release dnf coreutils bash passwd shadow-utils curl wget

          mkdir -p $BUILD_ROOTFS/etc
          
          ls $BUILD_ROOTFS/
          
          echo "nameserver 8.8.8.8" > $BUILD_ROOTFS/etc/resolv.conf
          
      - name: Install KDE Plasma and Core Features
        run: |
          chroot build-rootfs dnf install -y @kde-desktop 

      - name: Install VPN Plugins and Drivers
        run: |
          chroot ./build-rootfs dnf install -y --skip-unavailable \
          NetworkManager-sstp NetworkManager-pptp NetworkManager-l2tp \
          NetworkManager-libreswan NetworkManager-openvpn NetworkManager-wireguard \
          mesa-dri-drivers mesa-vulkan-drivers mesa-va-drivers mesa-vdpau-drivers

      - name: Install Application Suite
        run: |
          
          chroot ./build-rootfs  dnf install -y --skip-unavailable \
          kwave krecord skanlite kamera k3b ark kate yad flatpak \
          konqueror falkon haruna gwenview gparted filelight discover cups gutenprint foomatic

      - name: Configure Users and Passwords
        run: |
            chroot $(pwd)/build-rootfs useradd -m -s /bin/bash -c puppy puppy
            echo "puppy:puppy" | chroot $(pwd)/build-rootfs chpasswd
            echo "root:woofwoof" | chroot ${WKGBASE}/${ROOTFS} chpasswd

      - name: Final Cleanup
        run: |
          chroot ./build-rootfs dnf clean all
          rm -rf ./build-rootfs/var/cache/dnf

      - name: Pack to SquashFS
        run: |
          mksquashfs ./build-rootfs fedora-kde-puppy.squashfs -b 1M -comp xz

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-kde-rootfs
          path: fedora-kde-puppy.squashfs
