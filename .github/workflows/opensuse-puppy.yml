
name: Build Custom openSUSE Tumbleweed KDE RootFS (Testing)

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest

    container:
      image: opensuse/tumbleweed:latest
      options: --privileged

    steps:
      - name: Install Host Build Dependencies
        run: |
          zypper --non-interactive refresh

          zypper --non-interactive install --no-recommends \
            wget curl tar xz squashfs \
            gcc gcc-c++ make automake autoconf \
            gtk2-devel gtk3-devel \
            libxml2-devel glib2-devel \
            git shadow busybox docker

      - name: Set up openSUSE Tumbleweed Bootstrap RootFS
        shell: bash
        run: |
          set -e

          BUILD_ROOTFS="$(pwd)/build-rootfs"

          mkdir -p "$BUILD_ROOTFS/etc/zypp/repos.d"

          # Copy repository configuration.
          cp -a /etc/zypp/repos.d/. \
            "$BUILD_ROOTFS/etc/zypp/repos.d/"

          # Configure DNS.
          cp -L /etc/resolv.conf \
            "$BUILD_ROOTFS/etc/resolv.conf"

          # Bootstrap target root filesystem.
          zypper --root "$BUILD_ROOTFS" \
            --non-interactive \
            --gpg-auto-import-keys \
            install --no-recommends \
            filesystem \
            rpm \
            zypper \
            openSUSE-release \
            systemd \
            bash \
            coreutils \
            shadow \
            curl \
            wget \
            iproute2

          echo "Bootstrap completed."
          ls -la "$BUILD_ROOTFS"

      - name: Install KDE Plasma and Core Features
        shell: bash
        run: |
          set -e

          chroot ./build-rootfs \
            zypper --non-interactive refresh

          chroot ./build-rootfs \
            zypper --non-interactive \
            install --no-recommends \
            -t pattern kde

      - name: Install VPN Plugins and Graphics Drivers
        shell: bash
        run: |
          set -e

          chroot ./build-rootfs \
            zypper --non-interactive \
            install --no-recommends \
            NetworkManager \
            NetworkManager-l2tp \
            NetworkManager-pptp \
            NetworkManager-libreswan \
            NetworkManager-openvpn \
            NetworkManager-wireguard \
            Mesa-dri \
            Mesa-vulkan-device-select \
            Mesa-libva \
            Mesa-vdpau

          # SSTP is optional if unavailable.
          chroot ./build-rootfs bash -c '
            zypper --non-interactive install NetworkManager-sstp || \
              echo "WARNING: NetworkManager-sstp is unavailable."
          '

      - name: Install Application Suite
        shell: bash
        run: |
          set -e

          chroot ./build-rootfs \
            zypper --non-interactive \
            install --no-recommends \
            kwave \
            kamera \
            k3b \
            ark \
            kate \
            yad \
            flatpak \
            konqueror \
            falkon \
            haruna \
            gwenview \
            gparted \
            filelight \
            discover6 \
            cups \
            gutenprint \
            foomatic-filters

      - name: Configure Users and Passwords
        shell: bash
        run: |
          set -e

          BUILD_ROOTFS="$(pwd)/build-rootfs"

          chroot "$BUILD_ROOTFS" \
            useradd -m -s /bin/bash -c "puppy" puppy

          echo "puppy:puppy" | \
            chroot "$BUILD_ROOTFS" chpasswd

          echo "root:woofwoof" | \
            chroot "$BUILD_ROOTFS" chpasswd

      - name: Final Cleanup
        shell: bash
        run: |
          set -e

          BUILD_ROOTFS="$(pwd)/build-rootfs"

          chroot "$BUILD_ROOTFS" \
            zypper clean --all

          rm -rf "$BUILD_ROOTFS/var/cache/zypp"
          rm -rf "$BUILD_ROOTFS/var/cache/zypp-solv"
          rm -rf "$BUILD_ROOTFS/var/cache/dnf"

          # Remove machine-specific identifiers.
          rm -f "$BUILD_ROOTFS/etc/machine-id"
          rm -f "$BUILD_ROOTFS/var/lib/dbus/machine-id"

          # Remove temporary resolver configuration.
          rm -f "$BUILD_ROOTFS/etc/resolv.conf"

      - name: Pack to SquashFS
        shell: bash
        run: |
          mksquashfs ./build-rootfs \
            opensuse-tumbleweed-kde-rootfs.squashfs \
            -b 1M \
            -comp xz \
            -Xdict-size 100%

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensuse-tumbleweed-kde-rootfs
          path: opensuse-tumbleweed-kde-rootfs.squashfs
